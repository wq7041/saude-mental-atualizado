<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercícios de Respiração · Mente em Equilíbrio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06060f;
            --bg-glass: rgba(15,15,45,0.55);
            --bg-glass-strong: rgba(20,20,55,0.7);
            --border-glass: rgba(255,255,255,0.06);
            --border-glass-hover: rgba(255,255,255,0.14);
            --text-primary: #f0f0f8;
            --text-secondary: #b8b8d0;
            --accent-cyan: #06b6d4;
            --accent-cyan-light: #22d3ee;
            --gradient-blue-purple: linear-gradient(135deg, #4a6cf7, #7c3aed);
            --gradient-cyan-teal: linear-gradient(135deg, #06b6d4, #14b8a6);
            --glow-blue: 0 0 40px rgba(74,108,247,0.25);
            --glow-cyan: 0 0 30px rgba(6,182,212,0.2);
            --radius-lg: 24px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .subpage-content {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .subpage-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .breathing-exercise {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 30px;
            margin: 20px 0;
        }
        .breathing-circle {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--gradient-blue-purple);
            margin: 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            transition: transform 0.1s;
            box-shadow: var(--glow-blue);
        }
        .breathing-circle.inhale { transform: scale(1.3); background: var(--gradient-cyan-teal); }
        .breathing-circle.exhale { transform: scale(0.8); background: var(--gradient-blue-purple); }
        .breathing-timer {
            font-size: 2rem;
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Space Grotesk', monospace;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all var(--transition-smooth);
            font-family: var(--font-body);
            margin: 5px;
        }
        .btn-primary { background: var(--gradient-blue-purple); color: #fff; box-shadow: var(--glow-blue); }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(74,108,247,0.5); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: #fff; border: 1px solid var(--border-glass); backdrop-filter: blur(10px); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--border-glass-hover); }
        .btn-sm { padding: 8px 16px; font-size: 0.85rem; }
        .back-link { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="subpage-content">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
        <h2 class="subpage-title">🧘 Exercícios de Respiração</h2>
        <p style="color:var(--text-secondary); margin-bottom:20px;">Escolha uma técnica e siga o círculo por 2 minutos.</p>

        <div class="breathing-exercise" id="breathingBox">
            <h3 id="breathingName">Respiração Diafragmática</h3>
            <div class="breathing-circle" id="breathingCircle">Inspira</div>
            <div class="breathing-timer" id="breathingTimer">02:00</div>
            <button class="btn btn-primary" id="breathingStart">Iniciar</button>
            <div style="margin-top:15px;">
                <button class="btn btn-sm btn-secondary" onclick="switchBreathing(0)">Diafragmática</button>
                <button class="btn btn-sm btn-secondary" onclick="switchBreathing(1)">4-7-8</button>
                <button class="btn btn-sm btn-secondary" onclick="switchBreathing(2)">Box Breathing</button>
            </div>
        </div>
    </div>

    <script>
        const breathingCircle = document.getElementById('breathingCircle');
        const breathingTimer = document.getElementById('breathingTimer');
        const breathingStart = document.getElementById('breathingStart');
        const breathingName = document.getElementById('breathingName');
        let breathingInterval, timerInterval;
        let currentBreathing = 0;
        const breathingPatterns = [
            { name: 'Respiração Diafragmática', inhale: 4, exhale: 6 },
            { name: 'Respiração 4-7-8', inhale: 4, hold: 7, exhale: 8 },
            { name: 'Box Breathing', inhale: 4, hold: 4, exhale: 4, hold2: 4 }
        ];

        window.switchBreathing = (index) => {
            currentBreathing = index;
            breathingName.textContent = breathingPatterns[index].name;
            clearInterval(breathingInterval);
            clearInterval(timerInterval);
            breathingCircle.textContent = 'Pronto';
            breathingCircle.classList.remove('inhale', 'exhale');
            breathingTimer.textContent = '02:00';
            breathingStart.disabled = false;
        };

        breathingStart.addEventListener('click', () => {
            breathingStart.disabled = true;
            let timeLeft = 120;
            const pattern = breathingPatterns[currentBreathing];
            let step = 0, stepTime = 0;
            const steps = [];
            if (currentBreathing === 0) {
                steps.push({ name: 'Inspira', time: pattern.inhale, class: 'inhale' });
                steps.push({ name: 'Expira', time: pattern.exhale, class: 'exhale' });
            } else if (currentBreathing === 1) {
                steps.push({ name: 'Inspira', time: pattern.inhale, class: 'inhale' });
                steps.push({ name: 'Segura', time: pattern.hold, class: '' });
                steps.push({ name: 'Expira', time: pattern.exhale, class: 'exhale' });
            } else {
                steps.push({ name: 'Inspira', time: pattern.inhale, class: 'inhale' });
                steps.push({ name: 'Segura', time: pattern.hold, class: '' });
                steps.push({ name: 'Expira', time: pattern.exhale, class: 'exhale' });
                steps.push({ name: 'Segura', time: pattern.hold2, class: '' });
            }

            function runStep() {
                if (timeLeft <= 0) {
                    clearInterval(breathingInterval);
                    clearInterval(timerInterval);
                    breathingCircle.textContent = 'Fim';
                    breathingCircle.classList.remove('inhale', 'exhale');
                    breathingStart.disabled = false;
                    return;
                }
                const s = steps[step % steps.length];
                breathingCircle.textContent = s.name;
                breathingCircle.classList.remove('inhale', 'exhale');
                if (s.class) breathingCircle.classList.add(s.class);
                stepTime = s.time;
                step++;
            }
            runStep();
            breathingInterval = setInterval(() => {
                stepTime--;
                if (stepTime <= 0) runStep();
            }, 1000);
            timerInterval = setInterval(() => {
                timeLeft--;
                const min = Math.floor(timeLeft / 60);
                const sec = timeLeft % 60;
                breathingTimer.textContent = `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
                if (timeLeft <= 0) clearInterval(timerInterval);
            }, 1000);
        });
    </script>
</body>
</html>
