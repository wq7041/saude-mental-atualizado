<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço de Apoio · Mente em Equilíbrio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06060f;
            --bg-glass: rgba(15,15,45,0.55);
            --bg-glass-strong: rgba(20,20,55,0.7);
            --border-glass: rgba(255,255,255,0.06);
            --border-glass-hover: rgba(255,255,255,0.14);
            --text-primary: #f0f0f8;
            --text-secondary: #b8b8d0;
            --accent-cyan: #06b6d4;
            --gradient-blue-purple: linear-gradient(135deg, #4a6cf7, #7c3aed);
            --glow-cyan: 0 0 30px rgba(6,182,212,0.2);
            --radius-lg: 24px;
            --radius-md: 18px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition-fast: 0.2s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .subpage-content {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .subpage-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .support-number {
            font-size: 4rem;
            font-weight: 800;
            background: var(--gradient-blue-purple);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 20px 0;
        }
        .support-links a {
            display: block;
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 15px;
            margin-bottom: 10px;
            color: var(--text-primary);
            text-decoration: none;
            transition: all var(--transition-fast);
            text-align: left;
        }
        .support-links a:hover {
            border-color: var(--accent-cyan);
            box-shadow: var(--glow-cyan);
        }
        .back-link { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="subpage-content">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
        <h2 class="subpage-title">💬 Espaço de Apoio</h2>
        <p style="color:var(--text-secondary);">Você não está sozinho. Conte com esses recursos.</p>
        <div class="support-number">188</div>
        <p style="font-size:1.2rem;">Central de Valorização da Vida (CVV)</p>
        <p style="color:var(--text-secondary);">Ligue gratuitamente ou acesse o chat online 24h.</p>
        <div class="support-links">
            <a href="https://www.cvv.org.br" target="_blank"><i class="fa-solid fa-globe"></i> Site do CVV</a>
            <a href="https://www.cvv.org.br/chat" target="_blank"><i class="fa-solid fa-comments"></i> Chat Online</a>
            <a href="https://www.gov.br/saude" target="_blank"><i class="fa-solid fa-hospital"></i> Ministério da Saúde</a>
            <a href="https://www.setembroamarelo.com" target="_blank"><i class="fa-solid fa-ribbon"></i> Setembro Amarelo</a>
            <a href="https://www.paho.org" target="_blank"><i class="fa-solid fa-earth-americas"></i> OPAS/OMS</a>
        </div>
    </div>
</body>
</html>
