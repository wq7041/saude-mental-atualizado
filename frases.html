<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frases Motivacionais · Mente em Equilíbrio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #06060f;
            --bg-glass: rgba(15,15,45,0.55);
            --bg-glass-strong: rgba(20,20,55,0.7);
            --border-glass: rgba(255,255,255,0.06);
            --border-glass-hover: rgba(255,255,255,0.14);
            --text-primary: #f0f0f8;
            --text-secondary: #b8b8d0;
            --accent-cyan: #06b6d4;
            --gradient-blue-purple: linear-gradient(135deg, #4a6cf7, #7c3aed);
            --glow-blue: 0 0 40px rgba(74,108,247,0.25);
            --radius-lg: 24px;
            --radius-md: 18px;
            --font-display: 'Outfit', sans-serif;
            --font-body: 'Inter', sans-serif;
            --transition-fast: 0.2s ease;
            --transition-smooth: 0.35s ease;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: var(--font-body);
            background: var(--bg-deep);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .subpage-content {
            background: var(--bg-glass-strong);
            backdrop-filter: blur(24px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 40px 30px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .subpage-title {
            font-family: var(--font-display);
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }
        .quote-box {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 40px;
            text-align: center;
            font-size: 1.5rem;
            font-style: italic;
            margin: 20px 0;
        }
        .diary-entries {
            margin-top: 20px;
            text-align: left;
        }
        .diary-entry {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 12px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all var(--transition-smooth);
            font-family: var(--font-body);
            margin: 5px;
        }
        .btn-primary { background: var(--gradient-blue-purple); color: #fff; box-shadow: var(--glow-blue); }
        .btn-primary:hover { box-shadow: 0 0 30px rgba(74,108,247,0.5); transform: translateY(-2px); }
        .btn-secondary { background: rgba(255,255,255,0.04); color: #fff; border: 1px solid var(--border-glass); backdrop-filter: blur(10px); }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); border-color: var(--border-glass-hover); }
        .back-link { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; margin-bottom: 20px; display: inline-block; }
        .back-link:hover { color: #fff; }
    </style>
</head>
<body>
    <div class="subpage-content">
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
        <h2 class="subpage-title">🌟 Frases Motivacionais</h2>
        <div class="quote-box" id="quoteDisplay">"Acredite em você mesmo e tudo será possível."</div>
        <button class="btn btn-primary" onclick="newQuote()">Nova Frase</button>
        <button class="btn btn-secondary" onclick="favoriteQuote()"><i class="fa-regular fa-heart"></i> Favoritar</button>
        <div class="diary-entries" id="favQuotes" style="margin-top:20px;"></div>
    </div>

    <script>
        const quotes = [
            "Acredite em você mesmo e tudo será possível.",
            "A jornada mais longa começa com um único passo.",
            "Sua mente é um jardim, cultive pensamentos positivos.",
            "Você é mais forte do que imagina.",
            "Cada dia é uma nova chance para recomeçar.",
            "O sucesso é a soma de pequenos esforços repetidos.",
            "Não desista, grandes coisas levam tempo.",
            "Seja a mudança que você deseja ver no mundo."
        ];

        window.newQuote = () => {
            const i = Math.floor(Math.random() * quotes.length);
            document.getElementById('quoteDisplay').textContent = `"${quotes[i]}"`;
        };

        window.favoriteQuote = () => {
            const text = document.getElementById('quoteDisplay').textContent;
            let favs = JSON.parse(localStorage.getItem('favQuotes') || '[]');
            if (!favs.includes(text)) {
                favs.unshift(text);
                localStorage.setItem('favQuotes', JSON.stringify(favs));
                renderFavs();
            }
        };

        function renderFavs() {
            const favs = JSON.parse(localStorage.getItem('favQuotes') || '[]');
            document.getElementById('favQuotes').innerHTML = favs.map(q => `<div class="diary-entry">${q}</div>`).join('');
        }
        renderFavs();
    </script>
</body>
</html>
