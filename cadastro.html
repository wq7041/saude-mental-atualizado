<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta · Mente em Equilíbrio</title>

    <!-- Fonts e ícones -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- CSS globais -->
    <link rel="stylesheet" href="../css/main.css">
    <!-- CSS específico da página de cadastro -->
    <link rel="stylesheet" href="../css/cadastro.css">
</head>
<body>
    <!-- Fundo ambiente (orbes e grid) -->
    <div class="bg-ambient">
        <div class="bg-orb bg-orb--1"></div>
        <div class="bg-orb bg-orb--2"></div>
        <div class="bg-orb bg-orb--3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar ao início</a>
            <h2>🧠 Mente em Equilíbrio</h2>
            <p class="subtitle">Crie sua conta gratuitamente</p>

            <div id="erroMsg" class="erro-msg"></div>
            <div id="sucessoMsg" class="sucesso-msg"></div>

            <form id="cadastroForm" novalidate>
                <div class="form-group">
                    <label for="nome">Nome completo</label>
                    <input type="text" id="nome" placeholder="Seu nome" required autocomplete="name">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="seu@email.com" required autocomplete="email">
                </div>
                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Mínimo 6 caracteres" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <input type="password" id="confirmarSenha" placeholder="Repita a senha" required autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full" id="cadastroBtn">
                    <span class="spinner"></span>
                    <span class="btn-text"><i class="fa-solid fa-user-plus"></i> Criar conta</span>
                </button>
            </form>

            <div class="links-bottom">
                <p>Já tem uma conta? <a href="login.html">Entrar</a></p>
            </div>
        </div>
    </div>

    <script>
        (function() {
            function setSession(token, usuario) {
                localStorage.setItem('token', token);
                localStorage.setItem('usuario', JSON.stringify(usuario));
            }

            const form = document.getElementById('cadastroForm');
            const erroMsg = document.getElementById('erroMsg');
            const sucessoMsg = document.getElementById('sucessoMsg');
            const cadastroBtn = document.getElementById('cadastroBtn');
            const nomeInput = document.getElementById('nome');
            const emailInput = document.getElementById('email');
            const senhaInput = document.getElementById('senha');
            const confirmarInput = document.getElementById('confirmarSenha');

            function showError(msg) {
                erroMsg.textContent = msg;
                erroMsg.style.display = 'block';
                sucessoMsg.style.display = 'none';
            }
            function showSuccess(msg) {
                sucessoMsg.textContent = msg;
                sucessoMsg.style.display = 'block';
                erroMsg.style.display = 'none';
            }
            function hideMessages() {
                erroMsg.style.display = 'none';
                sucessoMsg.style.display = 'none';
            }
            function setLoading(loading) {
                if (loading) {
                    cadastroBtn.classList.add('loading');
                    cadastroBtn.disabled = true;
                } else {
                    cadastroBtn.classList.remove('loading');
                    cadastroBtn.disabled = false;
                }
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                hideMessages();

                const nome = nomeInput.value.trim();
                const email = emailInput.value.trim();
                const senha = senhaInput.value;
                const confirmarSenha = confirmarInput.value;

                if (!nome || !email || !senha || !confirmarSenha) {
                    showError('Preencha todos os campos.');
                    return;
                }
                if (senha !== confirmarSenha) {
                    showError('As senhas não coincidem.');
                    return;
                }
                if (senha.length < 6) {
                    showError('A senha deve ter no mínimo 6 caracteres.');
                    return;
                }

                setLoading(true);
                try {
                    const resp = await fetch('../api/cadastro.php', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ nome, email, senha })
                    });
                    const data = await resp.json();
                    if (!resp.ok || data.erro) {
                        throw new Error(data.erro || 'Erro ao criar conta.');
                    }

                    setSession(data.token, data.usuario);
                    showSuccess('Conta criada com sucesso! Redirecionando...');
                    setTimeout(() => {
                        window.location.href = 'dashboard-pessoal.html';
                    }, 1500);
                } catch (err) {
                    console.error(err);
                    showError(err.message || 'Erro de conexão com o servidor.');
                } finally {
                    setLoading(false);
                }
            });
        })();
    </script>
</body>
</html>
