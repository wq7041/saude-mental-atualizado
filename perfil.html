<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil · Mente em Equilíbrio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/perfil.css">
</head>
<body>
    <div class="bg-ambient">
        <div class="bg-orb bg-orb--1"></div>
        <div class="bg-orb bg-orb--2"></div>
        <div class="bg-orb bg-orb--3"></div>
    </div>
    <div class="bg-grid"></div>

    <div class="perfil-wrapper">
        <div class="perfil-card">
            <a href="dashboard-pessoal.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> Voltar</a>
            <div class="perfil-header">
                <h2 id="perfilNome">Carregando...</h2>
                <p id="perfilBio" class="perfil-bio"></p>
            </div>

            <form id="perfilForm" class="perfil-form">
                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" placeholder="Seu nome">
                </div>
                <div class="form-group">
                    <label for="bio">Bio</label>
                    <textarea id="bio" rows="3" placeholder="Conte um pouco sobre você..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-full">Salvar Alterações</button>
            </form>

            <button class="btn btn-secondary btn-full" id="logoutBtn" style="margin-top:12px;">
                <i class="fa-solid fa-right-from-bracket"></i> Sair da conta
            </button>
        </div>
    </div>

    <script src="../js/auth.js"></script>
    <script>
        Auth.requireAuth();

        async function carregarPerfil() {
            try {
                const resp = await fetch('../api/perfil.php', { headers: Auth.authHeaders() });
                if (!resp.ok) throw new Error('Erro ' + resp.status);
                const data = await resp.json();
                if (data.erro) throw new Error(data.erro);

                document.getElementById('perfilNome').textContent = data.nome || 'Usuário';
                document.getElementById('perfilBio').textContent = data.bio || 'Sem bio';
                document.getElementById('nome').value = data.nome || '';
                document.getElementById('bio').value = data.bio || '';
            } catch (err) {
                console.error('Erro ao carregar perfil:', err);
                alert('Erro ao carregar perfil. Verifique sua conexão.');
            }
        }

        document.getElementById('perfilForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nome = document.getElementById('nome').value.trim();
            const bio = document.getElementById('bio').value.trim();

            if (!nome) {
                alert('O nome é obrigatório.');
                return;
            }

            try {
                const resp = await fetch('../api/perfil.php', {
                    method: 'PUT',
                    headers: Auth.authHeaders(),
                    body: JSON.stringify({ nome, bio })
                });
                const data = await resp.json();
                if (data.erro) throw new Error(data.erro);
                                alert('Perfil atualizado!');
                // Atualiza localStorage com os novos dados
                const usuario = Auth.getUsuario();
                if (usuario) {
                    usuario.nome = nome;
                    usuario.bio = bio;
                    localStorage.setItem('usuario', JSON.stringify(usuario));
                }
                carregarPerfil();
            } catch (err) {
                console.error(err);
                alert('Erro ao atualizar perfil.');
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (confirm('Tem certeza que deseja sair?')) Auth.logout();
        });

        carregarPerfil();
    </script>
</body>
</html>
